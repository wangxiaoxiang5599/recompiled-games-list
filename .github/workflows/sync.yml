# Pull the latest list from portedgames.com once a day (after the site's own daily deploy at 06:00 UTC)
# and commit if anything changed.
name: Sync from portedgames.com

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md index.html
          git commit -m "Sync $(date -u +%Y-%m-%d)"
          git push
